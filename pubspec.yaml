name: flash_light_pro
description: "Offline flashlight with screen light, SOS, strobe, Morse, timer, and system integrations."
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  shared_preferences: ^2.5.6
  sensors_plus: ^7.1.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  in_app_update: ^5.0.0
  url_launcher: ^6.3.3
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.3
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/


