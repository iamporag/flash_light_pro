plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android plugin.
    id "dev.flutter.flutter-gradle-plugin"
}

// AdMob requires a valid App ID in the merged manifest. The default below is
// Google's official test App ID so local builds keep working. Production builds
// must supply the real App ID with -PadmobAppId=... or ADMOB_APP_ID.
def admobAppId = project.findProperty("admobAppId") ?: System.getenv("ADMOB_APP_ID")
def hasAdmobAppId = admobAppId != null && !admobAppId.trim().isEmpty()
if (!hasAdmobAppId) {
    admobAppId = "ca-app-pub-3940256099942544~3347511713"
    logger.warn(
        "AdMob App ID is not configured. Debug builds use Google's test App ID; " +
        "release builds fail instead of shipping an invalid manifest. " +
        "Pass -PadmobAppId=ca-app-pub-XXXX~YYYY (or set ADMOB_APP_ID) " +
        "before publishing."
    )
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

android {
    namespace = "com.claudysoft.flashlightpro"
    compileSdk 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    defaultConfig {
        applicationId = "com.claudysoft.flashlightpro"
        minSdk 24
        targetSdk 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // Appends so the Flutter plugin's applicationName placeholder survives.
        manifestPlaceholders.admobAppId = admobAppId
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            } else {
                logger.warn(
                    "Release signing is not configured. " +
                    "Copy android/key.properties.example to android/key.properties " +
                    "and provide your upload keystore before publishing."
                )
            }
        }
    }
}

// The Google Mobile Ads manifest provider throws at startup when the App ID is
// missing or invalid, so a release artifact must never be produced without a
// real one. Checking at execution time keeps debug builds configuration-safe.
tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    doFirst {
        if (!hasAdmobAppId) {
            throw new GradleException(
                "AdMob App ID is required for release builds. " +
                "Pass -PadmobAppId=ca-app-pub-XXXX~YYYY or set ADMOB_APP_ID " +
                "to your production AdMob App ID."
            )
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
