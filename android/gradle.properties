org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# AGP 9 compiles Kotlin itself. settings.gradle pins the KGP version it uses
# so the built-in compiler meets Flutter's minimum Kotlin version.
android.builtInKotlin=true
# Flutter 3.47's Gradle plugin still reads AGP's legacy DSL interface; the
# AGP 9 new DSL fails plugin application until Flutter supports it.
android.newDsl=false
